name: ci
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # IRC tests run against the real Ergo, the same version as the compose file. The binary is
      # static, so it is copied out of the official image.
      - name: Get Ergo
        run: |
          id=$(docker create ghcr.io/ergochat/ergo:v2.19.1)
          docker cp "$id:/ircd-bin/ergo" "$RUNNER_TEMP/ergo"
          docker rm "$id"
          echo "ERGO_BIN=$RUNNER_TEMP/ergo" >> "$GITHUB_ENV"
      - run: pnpm typecheck
      - run: pnpm build
      # Unit tests, then the placeholder-name check over source AND the build output.
      - run: pnpm test
        env:
          REQUIRE_BUILD: "1"
          REQUIRE_DB: "1"
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
          REQUIRE_REDIS: "1"
          REQUIRE_ERGO: "1"
          TEST_REDIS_URL: redis://localhost:6379

  e2e:
    runs-on: ubuntu-latest
    needs: check
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # IRC tests run against the real Ergo, the same version as the compose file. The binary is
      # static, so it is copied out of the official image.
      - name: Get Ergo
        run: |
          id=$(docker create ghcr.io/ergochat/ergo:v2.19.1)
          docker cp "$id:/ircd-bin/ergo" "$RUNNER_TEMP/ergo"
          docker rm "$id"
          echo "ERGO_BIN=$RUNNER_TEMP/ergo" >> "$GITHUB_ENV"
      - run: pnpm build
      - name: Install the browser
        run: pnpm --filter @app/e2e exec playwright install --with-deps chromium
      # The real built site, in a desktop browser and a phone: the roadmap's acceptance flow,
      # sign-in and recovery, the window manager, themes, OIDC through the real login page, and
      # an accessibility scan of every main screen in both themes.
      - run: pnpm test:e2e
        env:
          REQUIRE_ERGO: "1"
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
          TEST_REDIS_URL: redis://localhost:6379
      - name: Keep the failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: e2e/.tmp/
          retention-days: 7

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: |
          cp deploy/.env.example deploy/.env
          echo "APP_SECRET_KEY=$(openssl rand -base64 32)" >> deploy/.env
          docker compose -f deploy/compose.yaml --env-file deploy/.env config --quiet
      - name: Bring the stack up and check it
        run: |
          cp deploy/.env.example deploy/.env
          echo "APP_SECRET_KEY=$(openssl rand -base64 32)" >> deploy/.env
          docker compose -f deploy/compose.yaml --env-file deploy/.env up --build -d --wait
          curl -fsS http://localhost:8080/api/v1/site
          curl -fsS http://localhost:8080/ | grep -q '<div id="root">'
      - name: Logs on failure
        if: failure()
        run: docker compose -f deploy/compose.yaml --env-file deploy/.env logs
