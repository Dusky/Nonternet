# Site config: the one place the product name and domains live.
# Copy to site.yaml, edit, and point SITE_CONFIG at it. Nothing else in the repo may hard-code
# these values (CLAUDE.md), and tests/placeholder-name.test.ts enforces that.
site:
  name: Nonternet            # placeholder — change freely
  short_name: nonternet
  domain: example.net
  # People's homepages live at {handle}.{homes_domain}. Browsers send every *.localhost name to this machine, so
  # locally http://{handle}.homes.localhost:8081/ works with no setup (Chrome, Firefox; Safari needs a hosts line).
  # In production set your real homes domain, with a wildcard DNS record (*.example-homes.net); sitectl doctor checks it.
  homes_domain: homes.localhost

signup:
  mode: invite               # open | invite | application
  require_email: true

limits:
  homepage_quota_mb: { user: 50, trusted: 100 }
  trusted_board_quota: 3
  trusted_ring_quota: 2
  trusted_channel_quota: 3   # IRC channels a trusted user may register besides ring channels
  file_max_mb: 25            # largest single file in the file areas
  file_quota_mb: 250         # file area space for each uploader (admins have none)

# Services that sign users in through the OIDC provider at /oidc. IRC and the MUD do not use it: they
# ask core directly (docs/08, 09). A confidential client (a server) needs its secret in core's
# environment, never in this file: OIDC_SECRET_<CLIENT_ID> (at least 32 characters).
# oidc:
#   clients:
#     - { client_id: some-service, redirect_uris: ["https://example.net/some-service/callback"] }

# Each service turns on as its milestone ships.
services:
  bbs: true                  # telnet, SSH and the web Terminal window (docs/04)
  irc: true
  mud: true
  gopher: true               # read-only mirror of public boards, homepages and file areas
  finger: true               # finger handle@host: a person's public profile and .plan
  gemini: true               # read-only Gemini mirror: what Gopher shows, plus profiles and plans

# How callers reach the BBS. The local stack publishes telnet on 2323 and SSH on 2222; production uses 23 and 22.
bbs:
  host: localhost
  telnet_port: 2323
  ssh_port: 2222
  # Door games (docs/04). Each is a command the BBS runs for one caller; only list programs you trust, and
  # consider a sandbox in door_wrapper. {dropfile}, {dropdir} and {node} are filled in.
  # doors:
  #   - id: tw2002
  #     name: Trade Wars
  #     description: Space trading
  #     command: ["dosbox-x", "-conf", "/doors/tw.conf", "-c", "TW2002.EXE {dropfile}"]
  #     encoding: cp437
  #     max_nodes: 4
  #     time_limit_minutes: 30
  # door_wrapper: ["bwrap", "--ro-bind", "/", "/", "--unshare-net", "--"]

# Where Gopher clients reach it. The local stack publishes it on port 7070; production uses 70.
gopher:
  host: localhost
  port: 7070

# finger clients can't name a port, so production uses 79; the local stack publishes it on 7979.
finger:
  host: localhost
  port: 7979

# The Gemini mirror (docs/05, docs/19). certificate: self-signed (made once and kept, the Gemini custom) or site (the
# site's own from Caddy; set GEMINI_TLS_CERT and GEMINI_TLS_KEY in .env, see docs/19).
gemini:
  host: localhost
  port: 1965
  certificate: self-signed

irc:
  official_channels: ["#lobby", "#help"]   # the first is where everyone lands and announcements go
  # public_host: irc.example.net   # default irc.{site.domain}
  public_port: 6697
  history_days: 30   # chat history kept this long; people's own messages are in their export (Q9)

mud:
  # public_host: mud.example.net   # default mud.{site.domain}
  public_port: 4000                # telnet for native MUD clients

# Two-factor sign-in is optional; set true to require it for admins (also in the console under Settings).
security:
  require_admin_2fa: false
moderation:
  public_modlog: true   # each board's mod log can be read by anyone who can read the board

# The look. The site's own wallpapers are pictures in deploy/wallpapers/ (see the README there), offered in
# Settings next to the drawn patterns. default_wallpaper is dots, grid, stripes, plain or preset:{id}.
ui:
  default_theme: webring
  wallpapers: []
  # wallpapers:
  #   - { id: hills, name: Hills, file: hills.webp, fit: cover }
  #   - { id: stars, name: Stars, file: stars.png, fit: tile }
  default_wallpaper: dots
