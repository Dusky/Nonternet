# Site config: the one place the product name and domains live.
# Copy to site.yaml, edit, and point SITE_CONFIG at it. Nothing else in the repo may hard-code
# these values (CLAUDE.md), and tests/placeholder-name.test.ts enforces that.
site:
  name: Nonternet            # placeholder — change freely
  short_name: nonternet
  domain: example.net
  homes_domain: example-homes.net

signup:
  mode: invite               # open | invite | application
  require_email: true

limits:
  homepage_quota_mb: { user: 50, trusted: 100 }
  trusted_board_quota: 3
  trusted_ring_quota: 2
  trusted_channel_quota: 3   # IRC channels a trusted user may register besides ring channels
  file_max_mb: 25            # largest single file in the file areas
  file_quota_mb: 250         # file area space for each uploader (admins have none)

# Services that sign users in through the OIDC provider at /oidc. IRC and the MUD do not use it: they
# ask core directly (docs/08, 09). A confidential client (a server) needs its secret in core's
# environment, never in this file: OIDC_SECRET_<CLIENT_ID> (at least 32 characters).
# oidc:
#   clients:
#     - { client_id: some-service, redirect_uris: ["https://example.net/some-service/callback"] }

# Each service turns on as its milestone ships.
services:
  bbs: true                  # telnet, SSH and the web Terminal window (docs/04)
  irc: true
  mud: true
  gopher: true               # read-only mirror of public boards, homepages and file areas

# How callers reach the BBS. The local stack publishes telnet on 2323 and SSH on 2222; production uses 23 and 22.
bbs:
  host: localhost
  telnet_port: 2323
  ssh_port: 2222

# Where Gopher clients reach it. The local stack publishes it on port 7070; production uses 70.
gopher:
  host: localhost
  port: 7070

irc:
  official_channels: ["#lobby", "#help"]   # the first is where everyone lands and announcements go
  # public_host: irc.example.net   # default irc.{site.domain}
  public_port: 6697
  history_days: 7

mud:
  # public_host: mud.example.net   # default mud.{site.domain}
  public_port: 4000                # telnet for native MUD clients

moderation:
  public_modlog: true   # each board's mod log can be read by anyone who can read the board
