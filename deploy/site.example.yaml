# Site config: the one place the product name and domains live.
# Copy to site.yaml, edit, and point SITE_CONFIG at it. Nothing else in the repo may hard-code
# these values (CLAUDE.md), and tests/placeholder-name.test.ts enforces that.
site:
  name: Nonternet            # placeholder — change freely
  short_name: nonternet
  domain: example.net
  homes_domain: example-homes.net

signup:
  mode: invite               # open | invite | application
  require_email: true

limits:
  homepage_quota_mb: { user: 50, trusted: 100 }
  trusted_board_quota: 3
  trusted_ring_quota: 2
  trusted_channel_quota: 3   # IRC channels a trusted user may register besides ring channels

# Services that sign users in through the OIDC provider at /oidc (MUD, BBS). IRC does not use it: Ergo
# asks core directly (docs/08). Uncomment as they ship. A confidential client (a server) needs its secret in core's environment, never in this file:
# OIDC_SECRET_<CLIENT_ID>, e.g. OIDC_SECRET_MUD_SERVER (at least 32 characters).
# oidc:
#   clients:
#     - { client_id: mud-server, redirect_uris: ["https://example.net/mud/callback"] }

# Each service turns on as its milestone ships.
services:
  bbs: false
  irc: true
  mud: false

irc:
  official_channels: ["#lobby", "#help"]   # the first is where everyone lands and announcements go
  # public_host: irc.example.net   # default irc.{site.domain}
  public_port: 6697
  history_days: 7

moderation:
  public_modlog: true   # each board's mod log can be read by anyone who can read the board
