# `docker compose -f deploy/compose.yaml --env-file deploy/.env up --build`
# Local development stack. Service names are neutral (core, shell, caddy).
name: app

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_DB: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  core:
    build:
      context: ..
      dockerfile: apps/core/Dockerfile
    environment:
      SITE_CONFIG: /config/site.yaml
      PORT: "3000"
      DATABASE_URL: postgres://app:${POSTGRES_PASSWORD}@postgres:5432/app
      APP_SECRET_KEY: ${APP_SECRET_KEY:?set APP_SECRET_KEY in deploy/.env (openssl rand -base64 32)}
      # This is the local stack, served over plain http on localhost. Production sets
      # NODE_ENV=production and PUBLIC_URL=https://{site.domain} (compose.prod.yaml, later).
      NODE_ENV: development
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      TRUST_PROXY: "1"
      REDIS_URL: redis://redis:6379
      HOMES_DIR: /data/homes
      HOMES_PUBLIC_PORT: ${HOMES_HTTP_PORT:-8081}
    volumes:
      - ${SITE_CONFIG_FILE:-./site.example.yaml}:/config/site.yaml:ro
      - homes-data:/data/homes
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  # The homes server: people's homepages, on their own subdomains and domains. Same image as core,
  # its own process, port and (in production) hostnames, so a homepage is never on the site's origin.
  homes:
    build:
      context: ..
      dockerfile: apps/core/Dockerfile
    command: ["node", "homes-main.cjs"]
    environment:
      SITE_CONFIG: /config/site.yaml
      HOMES_PORT: "3100"
      HOMES_DIR: /data/homes
      DATABASE_URL: postgres://app:${POSTGRES_PASSWORD}@postgres:5432/app
      APP_SECRET_KEY: ${APP_SECRET_KEY:?set APP_SECRET_KEY in deploy/.env (openssl rand -base64 32)}
      NODE_ENV: development
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      HOMES_PUBLIC_PORT: ${HOMES_HTTP_PORT:-8081}
      TRUST_PROXY: "1"
    volumes:
      - ${SITE_CONFIG_FILE:-./site.example.yaml}:/config/site.yaml:ro
      - homes-data:/data/homes:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3100/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on:
      postgres: { condition: service_healthy }

  shell:
    build:
      context: ..
      dockerfile: apps/shell/Dockerfile

  caddy:
    image: caddy:2-alpine
    ports:
      - "${HTTP_PORT:-8080}:80"
      - "${HOMES_HTTP_PORT:-8081}:8081"
    environment:
      CADDY_ADDRESS: ${CADDY_ADDRESS:-:80}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - core
      - shell
      - homes

volumes:
  homes-data:
  postgres-data:
  redis-data:
  caddy-data:
