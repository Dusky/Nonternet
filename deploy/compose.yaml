# `docker compose -f deploy/compose.yaml --env-file deploy/.env up --build`
# Local development stack. Service names are neutral (core, shell, caddy).
name: app

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_DB: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  core:
    build:
      context: ..
      dockerfile: apps/core/Dockerfile
    environment:
      SITE_CONFIG: /config/site.yaml
      PORT: "3000"
      DATABASE_URL: postgres://app:${POSTGRES_PASSWORD}@postgres:5432/app
      APP_SECRET_KEY: ${APP_SECRET_KEY:?set APP_SECRET_KEY in deploy/.env (openssl rand -base64 32)}
      # This is the local stack, served over plain http on localhost. Production sets
      # NODE_ENV=production and PUBLIC_URL=https://{site.domain} (compose.prod.yaml, later).
      NODE_ENV: development
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      TRUST_PROXY: "1"
      REDIS_URL: redis://redis:6379
      HOMES_DIR: /data/homes
      HOMES_PUBLIC_PORT: ${HOMES_HTTP_PORT:-8081}
      # Shared with Ergo; core derives the auth-script token, API token and bot password from it.
      IRC_SECRET: ${IRC_SECRET:?set IRC_SECRET in deploy/.env (openssl rand -base64 32)}
      IRC_HOST: ergo
      IRC_API_URL: http://ergo:8089
      # Shared with the MUD. MUD_DATABASE_URL is here only so `cli backup` can dump the world too.
      MUD_SECRET: ${MUD_SECRET:?set MUD_SECRET in deploy/.env (openssl rand -base64 32)}
      MUD_URL: http://mud:4001
      MUD_DATABASE_URL: postgres://app:${POSTGRES_PASSWORD}@postgres:5432/mud
    volumes:
      - ${SITE_CONFIG_FILE:-./site.example.yaml}:/config/site.yaml:ro
      - homes-data:/data/homes
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  # The MUD (docs/09): Evennia, signing everyone in through core. Its world is in its own database.
  mud:
    build:
      context: ..
      dockerfile: services/mud/Dockerfile
    environment:
      SITE_CONFIG: /config/site.yaml
      MUD_SECRET: ${MUD_SECRET:?set MUD_SECRET in deploy/.env (openssl rand -base64 32)}
      CORE_URL: http://core:3000
      MUD_DATABASE_URL: postgres://app:${POSTGRES_PASSWORD}@postgres:5432/mud
      # Caddy's fixed address below: its X-Forwarded-For is trusted (Evennia matches exact addresses).
      MUD_UPSTREAM_IPS: 172.30.0.10
      # Account #1 on first start; nobody signs in as it (logins go through core).
      EVENNIA_SUPERUSER_USERNAME: sitebot
      EVENNIA_SUPERUSER_PASSWORD: ${MUD_SECRET:?set MUD_SECRET in deploy/.env}
      EVENNIA_SUPERUSER_EMAIL: ""
    volumes:
      - ${SITE_CONFIG_FILE:-./site.example.yaml}:/config/site.yaml:ro
    ports:
      # Telnet for native MUD clients.
      - "${MUD_TELNET_PORT:-4000}:4000"
    depends_on:
      postgres: { condition: service_healthy }
      core: { condition: service_started }

  # The homes server: people's homepages, on their own subdomains and domains. Same image as core,
  # its own process, port and (in production) hostnames, so a homepage is never on the site's origin.
  homes:
    build:
      context: ..
      dockerfile: apps/core/Dockerfile
    command: ["node", "homes-main.cjs"]
    environment:
      SITE_CONFIG: /config/site.yaml
      HOMES_PORT: "3100"
      HOMES_DIR: /data/homes
      DATABASE_URL: postgres://app:${POSTGRES_PASSWORD}@postgres:5432/app
      APP_SECRET_KEY: ${APP_SECRET_KEY:?set APP_SECRET_KEY in deploy/.env (openssl rand -base64 32)}
      NODE_ENV: development
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      HOMES_PUBLIC_PORT: ${HOMES_HTTP_PORT:-8081}
      TRUST_PROXY: "1"
    volumes:
      - ${SITE_CONFIG_FILE:-./site.example.yaml}:/config/site.yaml:ro
      - homes-data:/data/homes:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3100/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on:
      postgres: { condition: service_healthy }

  # Writes Ergo's config from the site config, then exits (docs/08). Same image as core.
  irc-config:
    build:
      context: ..
      dockerfile: apps/core/Dockerfile
    command: ["node", "cli.cjs", "irc-config", "--out", "/ircd/ircd.yaml"]
    user: "0"
    environment:
      SITE_CONFIG: /config/site.yaml
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      IRC_SECRET: ${IRC_SECRET:?set IRC_SECRET in deploy/.env (openssl rand -base64 32)}
      IRC_CORE_URL: http://core:3000
      IRC_AUTH_SCRIPT: /config/auth.sh
    volumes:
      - ${SITE_CONFIG_FILE:-./site.example.yaml}:/config/site.yaml:ro
      - ircd-data:/ircd

  # The IRC server. Accounts come from core through the auth-script; nobody registers on IRC itself.
  ergo:
    image: ghcr.io/ergochat/ergo:v2.19.1
    entrypoint: ["/bin/sh", "-c", "[ -f /ircd/ircd.db ] || /ircd-bin/ergo initdb --conf /ircd/ircd.yaml; exec /ircd-bin/ergo run --conf /ircd/ircd.yaml"]
    volumes:
      - ircd-data:/ircd
      - ../services/irc/auth.sh:/config/auth.sh:ro
    ports:
      # Plain IRC for trying a native client locally. Production listens with TLS on irc.public_port instead.
      - "127.0.0.1:${IRC_PLAIN_PORT:-6667}:6667"
    depends_on:
      irc-config: { condition: service_completed_successfully }

  shell:
    build:
      context: ..
      dockerfile: apps/shell/Dockerfile

  caddy:
    image: caddy:2-alpine
    ports:
      - "${HTTP_PORT:-8080}:80"
      - "${HOMES_HTTP_PORT:-8081}:8081"
    environment:
      CADDY_ADDRESS: ${CADDY_ADDRESS:-:80}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    networks:
      # A fixed address, so the MUD can trust the client addresses Caddy forwards (MUD_UPSTREAM_IPS).
      default: { ipv4_address: 172.30.0.10 }
    depends_on:
      - core
      - shell
      - homes
      - ergo
      - mud

networks:
  default:
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  ircd-data:
  homes-data:
  postgres-data:
  redis-data:
  caddy-data:
